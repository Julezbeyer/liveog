name: npm diagnostics

# Manual, read-only check that answers: which npm account does NPM_TOKEN belong
# to, which orgs can it see, and does it have publish rights on the scope?
# Prints no secrets — GitHub masks the token, and none of these commands echo it.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope to test, without the @"
        required: true
        default: "liveog"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Who does the token belong to?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- npm whoami ---"
          npm whoami || echo "FAILED: token invalid, expired, or not readable"

      - name: Which organizations does that account have?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          USER=$(npm whoami 2>/dev/null || true)
          if [ -z "$USER" ]; then echo "no user, skipping"; exit 0; fi
          echo "--- orgs for $USER ---"
          npm org ls "$USER" 2>/dev/null || true
          curl -s -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            "https://registry.npmjs.org/-/user/$USER/org" || true
          echo

      - name: Can the token publish to the requested scope?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SCOPE: ${{ inputs.scope }}
        run: |
          echo "--- members of org '$SCOPE' (404 here means the org does not exist) ---"
          npm org ls "$SCOPE" 2>&1 | head -5 || true
          echo
          echo "--- packages the token can reach ---"
          npm access list packages 2>&1 | head -20 || true
