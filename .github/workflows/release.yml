name: Release
on:
  push:
    branches: [main]
  # Lets a maintainer retry a failed publish (expired token, npm outage)
  # without pushing an empty commit.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create version PR or publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node writes an .npmrc that reads NODE_AUTH_TOKEN, not NPM_TOKEN.
          # Unused when trusted publishing (OIDC) is configured for the packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
